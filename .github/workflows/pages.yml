name: Pubblica MARINO Gestionale

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepara, correggi e valida sito MARINO
        run: |
          mkdir -p _site
          curl --fail --silent --show-error --location \
            "https://olkvweveldtkavmgccex.supabase.co/functions/v1/marino-app" \
            --output _site/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text()
          s=s.replace('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js')
          s=s.replace("onclick=\"editBooking(''+r.id+'')\"", "onclick=\"editBooking(\\''+r.id+'\\')\"")
          s=s.replace("onclick=\"delBooking(''+r.id+'')\"", "onclick=\"delBooking(\\''+r.id+'\\')\"")
          s=s.replace("onclick=\"toggleTable(''+t.code+'')\"", "onclick=\"toggleTable(\\''+t.code+'\\')\"")
          s=s.replace("onclick=\"deleteMenu(''+x.id+'')\"", "onclick=\"deleteMenu(\\''+x.id+'\\')\"")
          s=s.replace("if(confirm(t+'\n\nVuoi comunque forzare questa prenotazione?'))", "if(confirm(t+'\\n\\nVuoi comunque forzare questa prenotazione?'))")
          marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>'
          diag='''<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>window.addEventListener('error',function(e){var m=document.getElementById('authmsg');if(m){m.style.display='block';m.textContent='Errore app: '+(e.message||'errore JavaScript');}});</script><script>'''
          if marker in s: s=s.replace(marker,diag,1)
          p.write_text(s)
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/marino-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/marino-inline.js
          touch _site/.nojekyll
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
