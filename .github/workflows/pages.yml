name: Pubblica MARINO Gestionale

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepara, correggi e valida sito MARINO
        run: |
          mkdir -p _site
          curl --fail --silent --show-error --location \
            "https://olkvweveldtkavmgccex.supabase.co/functions/v1/marino-app" \
            --output _site/index.html
          python scripts/patch_marino.py
          python scripts/secondary_area_patch.py
          python scripts/turnover_patch.py
          python scripts/map_cards_patch.py
          python scripts/presence_patch.py
          python scripts/reservation_number_patch.py
          python scripts/map_details_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); css=Path('scripts/ui_refresh.css').read_text(); s=p.read_text()
          if '</head>' not in s: raise SystemExit('head non trovato per UI refresh')
          p.write_text(s.replace('</head>', '<style id="marino-ui-refresh">\n'+css+'\n</style></head>', 1))
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); css=Path('scripts/mobile_override.css').read_text(); s=p.read_text()
          if '</head>' not in s: raise SystemExit('head non trovato per mobile override')
          p.write_text(s.replace('</head>', css+'\n</head>', 1))
          PY
          python scripts/app_ready_patch.py
          python scripts/internal_layout_aug28_patch.py
          python scripts/password_recovery_patch.py
          python scripts/auth_stability_patch.py
          python scripts/manual_table_move_patch.py
          python scripts/atomic_chain_move_patch.py
          python scripts/history_mode_patch.py
          python scripts/bulk_area_reallocation_patch.py
          python scripts/square_force_4_patch.py
          python scripts/internal_tables_sep10_patch.py
          python scripts/reservation_edit_date_guard_patch.py
          python scripts/reservation_day_dropdown_patch.py
          python scripts/dehors_rules_map_filter_patch.py
          python scripts/map_day_selector_patch.py
          python scripts/edit_booking_occupancy_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html'); css=Path('scripts/premium_ui.css').read_text(); s=p.read_text()
          if '</head>' not in s: raise SystemExit('head non trovato per premium UI')
          p.write_text(s.replace('</head>', '<style id="marino-premium-ui">\n'+css+'\n</style></head>', 1))
          PY
          cp pwa/manifest.webmanifest _site/manifest.webmanifest
          cp pwa/sw.js _site/sw.js
          cp pwa/icon.svg _site/icon.svg
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('_site/index.html').read_text(); m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('modulo JS finale non trovato')
          Path('/tmp/marino-module-final.mjs').write_text(m.group(1))
          PY
          node --check /tmp/marino-module-final.mjs
          grep -q 'type="module"' _site/index.html
          grep -q 'bulkReallocateServiceArea' _site/index.html
          grep -q 'reallocate_reservations_area_batch' _site/index.html
          grep -q 'marino-internal-tables-sep10-v5' _site/index.html
          grep -q '__B123_TRIPLE__' _site/index.html
          grep -q 'marinoForce4Single' _site/index.html
          grep -q 'marinoFiveJollyPair' _site/index.html
          grep -q 'tableSelectionSummary' _site/index.html
          grep -q 'Prossimo' _site/index.html
          grep -q 'Turno precedente' _site/index.html
          grep -q 'availabilityWindow' _site/index.html
          grep -q 'coverRange' _site/index.html
          grep -q 'Menu disponibile' _site/index.html
          grep -q '+ Nuova prenotazione' _site/index.html
          grep -q '100dvh' _site/index.html
          grep -q 'safe-area-inset-bottom' _site/index.html
          grep -q 'marino-ui-refresh' _site/index.html
          grep -q 'marino-mobile-override' _site/index.html
          grep -q 'marino-premium-ui' _site/index.html
          grep -q 'Cliente arrivato' _site/index.html
          grep -q 'Libera tavolo' _site/index.html
          grep -q 'reservationDisplayNo' _site/index.html
          grep -q 'Password dimenticata?' _site/index.html
          grep -q 'persistSession:true' _site/index.html
          grep -q 'move_reservation_tables_batch' _site/index.html
          grep -q 'ARCHIVIO STORICO' _site/index.html
          grep -q 'chronoNotes' _site/index.html
          grep -q 'id="bookingDay"' _site/index.html
          grep -q 'id="mapDaySelector"' _site/index.html
          grep -q 'Tavoli occupati nel servizio' _site/index.html
          grep -q 'rel="manifest"' _site/index.html
          grep -q 'backupPanel' _site/index.html
          grep -q 'navigator.serviceWorker.register' _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test -f _site/icon.svg
          touch _site/.nojekyll
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
