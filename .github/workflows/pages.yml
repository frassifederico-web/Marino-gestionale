name: Pubblica MARINO Gestionale

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepara, correggi e valida sito MARINO
        run: |
          mkdir -p _site
          curl --fail --silent --show-error --location \
            "https://olkvweveldtkavmgccex.supabase.co/functions/v1/marino-app" \
            --output _site/index.html
          python scripts/patch_marino.py
          node --check /tmp/marino-module.mjs
          grep -q 'type="module"' _site/index.html
          grep -q 'tableSelectionSummary' _site/index.html
          grep -q 'Prossimo' _site/index.html
          grep -q 'coperti</div>' _site/index.html
          grep -q 'Rimpiazzo standard: almeno 1h45' _site/index.html
          grep -q 'Menu disponibile' _site/index.html
          grep -q '+ Nuova prenotazione' _site/index.html
          touch _site/.nojekyll
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
