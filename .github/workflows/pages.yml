name: Pubblica MARINO Gestionale

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepara, correggi e valida sito MARINO
        run: |
          mkdir -p _site
          curl --fail --silent --show-error --location \
            "https://olkvweveldtkavmgccex.supabase.co/functions/v1/marino-app" \
            --output _site/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text()
          s=s.replace("onclick=\"editBooking(''+r.id+'')\"", "onclick=\"editBooking(\\''+r.id+'\\')\"")
          s=s.replace("onclick=\"delBooking(''+r.id+'')\"", "onclick=\"delBooking(\\''+r.id+'\\')\"")
          s=s.replace("onclick=\"toggleTable(''+t.code+'')\"", "onclick=\"toggleTable(\\''+t.code+'\\')\"")
          s=s.replace("onclick=\"deleteMenu(''+x.id+'')\"", "onclick=\"deleteMenu(\\''+x.id+'\\')\"")
          s=s.replace("onclick=\"toggleMenu(''+x.id+'','+(!x.active)+')\"", "onclick=\"toggleMenu(\\''+x.id+'\\','+(!x.active)+')\"")
          s=s.replace("if(confirm(t+'\n\nVuoi comunque forzare questa prenotazione?'))", "if(confirm(t+'\\n\\nVuoi comunque forzare questa prenotazione?'))")

          new_picker="\n".join([
            "function hhmm(v){return v?String(v).slice(0,5):''}",
            "function intervalOverlaps(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&bStart<aEnd}",
            "function renderPicker(){",
            "  let room=$('room').value,start=hhmm($('arrival').value)||'00:00',end=hhmm($('endTime').value)||'23:59';",
            "  let roomTables=allTables.filter(t=>t.area===room&&t.active);",
            "  $('picker').innerHTML=roomTables.map(t=>{",
            "    let rs=links.filter(x=>x.restaurant_tables?.code===t.code&&x.reservation_id!==editing).map(x=>reservations.find(r=>r.id===x.reservation_id)).filter(Boolean);",
            "    let overlaps=rs.filter(r=>intervalOverlaps(start,end,hhmm(r.arrival_time),hhmm(r.expected_end_time)||'23:59'));",
            "    let used=rs.length>0;",
            "    let cl=overlaps.length?'busy':used?'rebook':'free';",
            "    let label='Libero';",
            "    if(overlaps.length){label='Occupato · '+overlaps.map(r=>hhmm(r.arrival_time)+'–'+(hhmm(r.expected_end_time)||'fine servizio')).join(', ');}",
            "    else if(used){label='Rimpiazzabile · '+rs.map(r=>hhmm(r.arrival_time)+'–'+(hhmm(r.expected_end_time)||'fine servizio')).join(', ');}",
            "    if(selected.includes(t.code))cl+=' selected';",
            "    return '<button type=\"button\" class=\"table '+cl+'\" '+(overlaps.length?'disabled aria-disabled=\"true\"':'data-table-code=\"'+esc(t.code)+'\"')+'><b>'+esc(t.label)+'</b><div class=\"muted\">'+esc(label)+'</div></button>';",
            "  }).join('');",
            "  $('picker').querySelectorAll('[data-table-code]').forEach(b=>b.addEventListener('click',()=>toggleTable(b.dataset.tableCode)));",
            "}function toggleTable"
          ])
          s,n=re.subn(r"function renderPicker\(\)\{.*?\}function toggleTable",lambda m:new_picker,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'renderPicker non sostituito: {n}')

          # Nuova prenotazione anche dalla pagina Prenotazioni.
          old_bookings='<section id="bookings" class="page"><div class="card"><h3>Prenotazioni</h3><div id="bookingList"></div></div></section>'
          new_bookings='<section id="bookings" class="page"><div class="card"><div class="actions" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Prenotazioni</h3><button class="primary" onclick="openBooking()">+ Nuova prenotazione</button></div><div id="bookingList" style="margin-top:10px"></div></div></section>'
          if old_bookings not in s:
              raise SystemExit('Sezione Prenotazioni attesa non trovata')
          s=s.replace(old_bookings,new_bookings,1)

          s=s.replace('<section id="menu" class="page"><div class="card"><h3>Menu di servizio</h3>', '<section id="menu" class="page"><div class="card" id="menuEditor"><h3>Gestione menu</h3>',1)
          s=s.replace('<section id="access" class="page"><div class="card"><h3>Accessi</h3>', '<section id="access" class="page"><div class="card"><h3>Accessi e amministrazione</h3><div id="menuAdminSlot"></div>',1)

          new_render_menu="""function renderMenu(){let cats=['Antipasto','Primo','Secondo','Dolce','Altro'];let visible=menuItems.filter(x=>x.active);$('menuList').innerHTML='<div class=\"card\"><h3>Menu disponibile</h3><div class=\"muted\">Consultazione rapida per telefonate, allergeni e intolleranze.</div></div>'+cats.map(c=>{let a=visible.filter(x=>x.category===c);if(!a.length)return'';return '<div class=\"card\"><h3>'+c+'</h3>'+a.map(x=>'<div class=\"row\"><div><b>'+esc(x.name)+' · '+(x.price==null?'—':Number(x.price).toFixed(2).replace('.',',')+' €')+'</b><div class=\"muted\">'+esc(x.description||'')+(x.allergens?.length?' · Allergeni: '+esc(x.allergens.join(', ')):'')+(x.dietary_tags?.length?' · '+esc(x.dietary_tags.join(', ')):'')+'</div></div></div>').join('')+'</div>'}).join('');renderMenuAdmin()}"""
          s,n=re.subn(r"function renderMenu\(\)\{.*?\}\nasync function addMenu",new_render_menu+'\nasync function addMenu',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'renderMenu non sostituito: {n}')

          admin_fn="\n".join([
            "function renderMenuAdmin(){",
            "  let editor=$('menuEditor'),slot=$('menuAdminSlot');",
            "  if(!editor||!slot)return;",
            "  if(profile?.role==='principal'){",
            "    editor.style.display='block';",
            "    if(editor.parentElement!==slot)slot.appendChild(editor);",
            "    let old=$('menuAdminList');if(old)old.remove();",
            "    let box=document.createElement('div');box.id='menuAdminList';box.className='card';box.innerHTML='<h3>Piatti caricati</h3>'+menuItems.map(x=>'<div class=\"row\"><div><b>'+esc(x.name)+'</b><div class=\"muted\">'+esc(x.category)+' · '+(x.active?'VISIBILE':'NASCOSTO')+'</div></div><div class=\"actions\"><button class=\"secondary\" data-menu-toggle=\"'+esc(x.id)+'\" data-active=\"'+(!x.active)+'\">'+(x.active?'Nascondi':'Mostra')+'</button><button class=\"danger\" data-menu-delete=\"'+esc(x.id)+'\">Elimina</button></div></div>').join('');slot.appendChild(box);",
            "    box.querySelectorAll('[data-menu-toggle]').forEach(b=>b.addEventListener('click',()=>toggleMenu(b.dataset.menuToggle,b.dataset.active==='true')));",
            "    box.querySelectorAll('[data-menu-delete]').forEach(b=>b.addEventListener('click',()=>deleteMenu(b.dataset.menuDelete)));",
            "  }else{",
            "    editor.style.display='none';",
            "    let old=$('menuAdminList');if(old)old.remove();",
            "  }",
            "}"
          ])
          s=s.replace('async function addMenu',admin_fn+'\nasync function addMenu',1)

          old='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'
          new='''<script type="module">\nimport { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";\n'''
          if old not in s:
              raise SystemExit('Tag Supabase atteso non trovato')
          s=s.replace(old,new,1)
          s=s.replace('const db=supabase.createClient(URL,KEY,','const db=createClient(URL,KEY,',1)

          expose="""\nObject.assign(window,{login,signup,logout,showPage,dayChanged,loadAll,saveServiceSettings,openBooking,closeBooking,setMapRoom,editBooking,toggleTable,saveBooking,delBooking,addMenu,toggleMenu,deleteMenu,inviteAdmin});\n$('arrival').addEventListener('change',renderPicker);\n$('endTime').addEventListener('change',renderPicker);\n"""
          marker='(async()=>{let s=(await db.auth.getSession()).data.session;if(s)afterAuth(s)})();'
          if marker not in s:
              raise SystemExit('Marker bootstrap non trovato')
          s=s.replace(marker,expose+marker,1)

          diag="""\nwindow.addEventListener('error',e=>{const m=document.getElementById('authmsg');if(m){m.style.display='block';m.textContent='Errore app: '+(e.message||'errore JavaScript');}});\nwindow.addEventListener('unhandledrejection',e=>{const m=document.getElementById('authmsg');if(m){m.style.display='block';m.textContent='Errore app: '+(e.reason?.message||String(e.reason||'promessa non gestita'));}});\n"""
          s=s.replace('const URL=',diag+'const URL=',1)

          mobile_css='''\n<style id="marino-mobile-booking-fix">\n@media(max-width:720px){\n  .modal{padding:0;align-items:stretch;justify-content:stretch}\n  .modal.open{display:block}\n  .modal .box{width:100%;height:100dvh;max-height:none;border-radius:0;border-left:0;border-right:0;padding:12px 10px 110px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}\n  .modal .box>.actions:first-child{position:sticky;top:0;z-index:5;background:var(--cream2);padding:6px 0 10px;margin:-2px 0 6px}\n  .modal .grid{grid-template-columns:1fr}\n  .modal .full{grid-column:1}\n  #picker{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;margin-top:10px!important;max-height:none!important;overflow:visible!important}\n  #picker .table{display:block!important;min-height:82px!important;width:100%!important;font-size:15px!important;padding:10px 8px!important}\n  #picker .table b{display:block;font-size:16px}\n  #picker .table:disabled{opacity:1;cursor:not-allowed}\n  #saveMsg{margin-bottom:8px}\n  .modal .box>button.primary[onclick*="saveBooking"]{position:sticky;bottom:10px;z-index:6;width:100%;min-height:52px;font-size:17px;box-shadow:0 8px 20px rgba(6,63,120,.18)}\n}\n</style>\n'''
          if '</head>' not in s:
              raise SystemExit('head non trovato')
          s=s.replace('</head>',mobile_css+'</head>',1)

          p.write_text(s)
          scripts=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if len(scripts)!=1:
              raise SystemExit(f'Atteso 1 script module, trovati {len(scripts)}')
          Path('/tmp/marino-module.mjs').write_text(scripts[0])
          PY
          node --check /tmp/marino-module.mjs
          grep -q 'type="module"' _site/index.html
          grep -q 'Object.assign(window' _site/index.html
          grep -q 'marino-mobile-booking-fix' _site/index.html
          grep -q 'Rimpiazzabile' _site/index.html
          grep -q 'menuAdminSlot' _site/index.html
          grep -q 'Menu disponibile' _site/index.html
          grep -q '<section id="bookings"' _site/index.html
          grep -q '+ Nuova prenotazione' _site/index.html
          touch _site/.nojekyll
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
