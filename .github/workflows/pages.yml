name: Pubblica MARINO Gestionale

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepara, correggi e valida sito MARINO
        run: |
          mkdir -p _site
          curl --fail --silent --show-error --location \
            "https://olkvweveldtkavmgccex.supabase.co/functions/v1/marino-app" \
            --output _site/index.html
          python scripts/patch_marino.py
          python scripts/turnover_patch.py
          python scripts/map_cards_patch.py
          python scripts/presence_patch.py
          python scripts/reservation_number_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          css=Path('scripts/ui_refresh.css').read_text()
          s=p.read_text()
          if '</head>' not in s:
              raise SystemExit('head non trovato per UI refresh')
          s=s.replace('</head>', '<style id="marino-ui-refresh">\n'+css+'\n</style></head>', 1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          css=Path('scripts/mobile_override.css').read_text()
          s=p.read_text()
          if '</head>' not in s:
              raise SystemExit('head non trovato per mobile override')
          s=s.replace('</head>', css+'\n</head>', 1)
          p.write_text(s)
          PY
          node --check /tmp/marino-module.mjs
          grep -q 'type="module"' _site/index.html
          grep -q 'tableSelectionSummary' _site/index.html
          grep -q 'Prossimo' _site/index.html
          grep -q 'Turno precedente' _site/index.html
          grep -q 'availabilityWindow' _site/index.html
          grep -q 'Tavolo prenotabile dalle ore' _site/index.html
          ! grep -q '15 min riassetto' _site/index.html
          ! grep -q '1h45 + 15 min' _site/index.html
          grep -q 'coverRange' _site/index.html
          grep -q 'IDEALE' _site/index.html
          grep -q 'Menu disponibile' _site/index.html
          grep -q '+ Nuova prenotazione' _site/index.html
          grep -q '100dvh' _site/index.html
          grep -q 'safe-area-inset-bottom' _site/index.html
          grep -q '@media(max-width:720px)' _site/index.html
          grep -q 'marino-ui-refresh' _site/index.html
          grep -q 'marino-mobile-override' _site/index.html
          grep -q 'SF Pro Text' _site/index.html
          grep -q 'mapBookingSlots' _site/index.html
          grep -q 'mapBookingName' _site/index.html
          grep -q 'mapBookingCovers' _site/index.html
          grep -q 'Cliente arrivato' _site/index.html
          grep -q 'Libera tavolo' _site/index.html
          grep -q 'arrivedCross' _site/index.html
          grep -q 'markArrived' _site/index.html
          grep -q 'releaseBooking' _site/index.html
          grep -q 'reservationDisplayNo' _site/index.html
          grep -q 'reservationNo' _site/index.html
          grep -q 'mapBookingNo' _site/index.html
          touch _site/.nojekyll
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
