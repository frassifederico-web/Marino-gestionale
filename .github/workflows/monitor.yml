name: Verifica MARINO ogni 10 minuti
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica applicazione pubblicata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://frassifederico-web.github.io/Marino-gestionale/"
          curl --fail --silent --show-error --location --retry 2 --max-time 30 "$url" -o /tmp/marino-live.html
          test -s /tmp/marino-live.html
          grep -q 'navigator.serviceWorker.register' /tmp/marino-live.html
          grep -q 'marino-map-details-v2' /tmp/marino-live.html
          grep -q 'MARINO booking-list table label sync' /tmp/marino-live.html
          curl --fail --silent --show-error --location --max-time 20 "https://frassifederico-web.github.io/Marino-gestionale/sw.js" -o /tmp/marino-sw.js
          test -s /tmp/marino-sw.js
          echo "MARINO: sito raggiungibile e marcatori principali presenti"
      - name: Verifica ultima pubblicazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          url="https://api.github.com/repos/frassifederico-web/Marino-gestionale/actions/workflows/pages.yml/runs?per_page=10"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=20) as response:
              runs=json.load(response)["workflow_runs"]
          finished=next((r for r in runs if r["status"]=="completed"),None)
          if finished is None:
              raise SystemExit("Nessuna pubblicazione completata")
          print("Ultima pubblicazione completata:",finished["html_url"],finished["conclusion"])
          if finished["conclusion"]!="success":
              raise SystemExit("Ultima pubblicazione fallita: intervento necessario")
          PY
